name: news_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  flutter_riverpod: ^3.4.2
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  http: ^1.6.0
  share_plus: ^13.3.0
