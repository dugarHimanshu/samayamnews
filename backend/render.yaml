# Render blueprint for the CLIENT DEMO only (free plan sleeps after ~15 min idle; first request takes ~50s).
# Production runs in an India region (see docs/backend-architecture.md).
services:
  - type: web
    name: samayam-api-demo
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_INLINE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
